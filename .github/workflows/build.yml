name: Build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build PartitionExplorer.sln -c Release -warnaserror
      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: PartitionExplorer
          path: |
            PartitionExplorer/bin/Release/net8.0-windows/
            !PartitionExplorer/bin/Release/net8.0-windows/*.pdb
