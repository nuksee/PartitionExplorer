name: Release

# Push a tag like v1.3 to build the zip and the Store MSIX and attach them to a
# draft GitHub release. Review the draft, edit the notes, then publish it.
# Run it by hand (Actions > Release > Run workflow) to get the files as
# workflow artifacts without making a release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $info = Get-Content PartitionExplorer/Properties/AssemblyInfo.cs -Raw
          if ($info -notmatch 'AssemblyFileVersion\("(\d+)\.(\d+)\.(\d+)\.\d+"\)') { throw "AssemblyFileVersion not found" }
          $v = "$($Matches[1]).$($Matches[2])"
          if ($Matches[3] -ne "0") { $v += ".$($Matches[3])" }
          "version=$v" >> $env:GITHUB_OUTPUT
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$v") {
            throw "Tag ${{ github.ref_name }} doesn't match AssemblyFileVersion $v. Bump Properties\AssemblyInfo.cs first."
          }

      - name: Build
        run: dotnet build PartitionExplorer.sln -c Release -warnaserror

      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $files = Get-ChildItem PartitionExplorer/bin/Release/net8.0-windows -Exclude *.pdb
          Compress-Archive $files "dist/PartitionExplorer-v${{ steps.version.outputs.version }}-win.zip"

      - name: Build MSIX
        shell: pwsh
        run: |
          ./packaging/build-msix.ps1
          Copy-Item packaging/out/*.msix dist/

      - uses: actions/upload-artifact@v4
        with:
          name: release-v${{ steps.version.outputs.version }}
          path: dist/*

      - name: Create draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/*.zip dist/*.msix --draft --title "PartitionExplorer ${{ steps.version.outputs.version }}" --generate-notes
